services:
  bot:
    build:
      context: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/bot.db
      LOGS_DIR: /app/logs
      BACKUPS_DIR: /app/backups
    volumes:
      - bot_data:/app/data
      - bot_logs:/app/logs
      - bot_backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bot_data:
  bot_logs:
  bot_backups:
